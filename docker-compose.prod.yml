# Production overrides — managed DBs, health checks, no bind mounts
services:
  api:
    restart: always
    environment:
      APP_ENV: production
      DEBUG: "false"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    restart: always
    deploy:
      replicas: 2

  postgres:
    profiles: ["local-only"]

  redis:
    profiles: ["local-only"]

  minio:
    profiles: ["local-only"]
