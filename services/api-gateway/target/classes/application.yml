spring:
  cloud:
    gateway:
      routes:
        - id: compliance-engine
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/compliance/**
        - id: agent-orchestrator
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/agent/**
        # other routes...
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/regula
server:
  port: 8080
